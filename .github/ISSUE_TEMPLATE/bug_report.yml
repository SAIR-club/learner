name: Bug Report
description: Report unexpected behavior in the learner application or interactive CLI
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue! Please verify against existing issues first.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or commands to reproduce the issue.
      placeholder: |
        1. Run `pnpm demo` or `pnpm --filter @episteme/app-learn start`
        2. Enter question `...`
        3. See error `...`
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node version, OS, pnpm version.
      value: |
        - Node: 
        - pnpm: 
        - OS: 
    validations:
      required: false
